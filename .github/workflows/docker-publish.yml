name: Build and Publish Docker image
# Publishes ghcr.io/grinchdubs/immich2github:latest for the TrueNAS Custom App.
# NOTE: the project lives in the immich-to-github/ subdirectory, so the build
# context and Dockerfile path point there, and the path filters watch that dir.

on:
  push:
    branches: [main]
    paths:
      - "immich-to-github/src/**"
      - "immich-to-github/config.yaml"
      - "immich-to-github/requirements.txt"
      - "immich-to-github/setup.py"
      - "immich-to-github/Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./immich-to-github
          file: ./immich-to-github/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
