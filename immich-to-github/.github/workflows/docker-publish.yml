name: Build and Publish Docker image
# Publishes ghcr.io/grinchdubs/immich2github:latest for the TrueNAS Custom App.

# Builds the sync image in the cloud and pushes it to GitHub Container
# Registry (ghcr.io) so TrueNAS can pull it. No local Docker needed.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.yaml"
      - "requirements.txt"
      - "setup.py"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
